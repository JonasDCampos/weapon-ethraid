<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeões de Ethraid</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--bd:#e4dcd0;--ac:#a8561a;--chip:#f1e8da;--hd:#efe6d6}
@media(prefers-color-scheme:dark){:root{--bg:#1b1815;--card:#252019;--tx:#eee6da;--mu:#a39787;--bd:#3a3329;--ac:#e0924f;--chip:#352d22;--hd:#2e271e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{padding:14px 18px 0;max-width:1400px;margin:auto}h1{margin:0 0 2px;font-size:22px;color:var(--ac)}
.sub{color:var(--mu);font-size:12px}
#top{display:flex;gap:8px;margin:12px 0 0}#top button{padding:8px 18px;font-weight:600;font-size:15px}#top button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
table.ct td,table.ct th{text-align:center}table.ct td.ft{text-align:left;min-width:150px}table.ct th{white-space:normal;line-height:1.2;padding:6px 5px}table.ct td{padding:5px 6px}table.ct .gh{border-bottom:1px solid var(--bd)}tr.cl:nth-child(even) td{background:color-mix(in srgb,var(--ac) 5%,var(--card))}tr.cl:hover td{background:color-mix(in srgb,var(--ac) 12%,var(--card))}
input.ci{width:100%;min-width:56px;field-sizing:content;padding:3px 5px;font-size:13px}th input.ci{font-weight:400;text-transform:none}
td:first-child,tr:first-child>th:first-child{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--bd)}tr:first-child>th:first-child{background:var(--hd);z-index:2}tr.g td:first-child{background:var(--hd)}
.w{-webkit-overflow-scrolling:touch}#top{flex-wrap:wrap}
@media(max-width:1100px){body{font-size:13px}th,td{padding:5px 6px}th{font-size:11px;letter-spacing:0}.chip{font-size:11px;padding:0 6px}.nv{display:none}header,main{padding-left:10px!important;padding-right:10px!important}td.n{white-space:normal;min-width:100px}}
@media(max-width:700px){#top button{padding:6px 10px;font-size:13px}nav button{padding:6px 9px}#q{max-width:none;min-width:0}td.n{white-space:normal;min-width:90px}}
nav{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 0;border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;cursor:pointer;font:inherit;border-bottom:3px solid transparent}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 9px}
textarea{width:100%;resize:vertical}button{cursor:pointer}button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#q{min-width:220px;flex:1;max-width:340px}
main{max-width:1400px;margin:auto;padding:0 18px 40px}
.w{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--bd)}
th{background:var(--hd);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--ac)}
tr.g td{background:var(--hd);font-weight:700;color:var(--ac)}
tr.r{cursor:pointer}tr.r:hover td{background:color-mix(in srgb,var(--ac) 7%,var(--card))}
td.n,td:nth-child(2){white-space:nowrap}td.n{font-weight:600}.nv{font-size:10px;background:var(--ac);color:#fff;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
tr.d td{background:var(--bg);white-space:pre-wrap;max-width:900px}
.chip{display:inline-block;background:var(--chip);border-radius:12px;padding:1px 9px;margin:1px 3px 1px 0;font-size:12px;border:1px dashed transparent}
.chip[data-tip]{cursor:help;border-color:var(--bd)}.chip[data-tip]:hover{border-color:var(--ac)}
.chip.v{font-style:italic}.hy{margin-top:5px;padding-top:5px;border-top:1px dotted var(--bd)}
#tip{position:fixed;z-index:9;max-width:340px;background:#2a2420;color:#faf3e8;border-radius:8px;padding:9px 12px;font-size:12.5px;box-shadow:0 6px 24px #0006;pointer-events:none;white-space:pre-wrap}
#tip b{color:#f3b27a}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:8px 0}
.card h3{margin:0 0 4px;font-size:15px;color:var(--ac)}.card p{margin:0;white-space:pre-wrap}.card input{font-weight:700}
h2{font-size:15px;margin:22px 0 4px;color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:min(680px,94vw);padding:16px}
dialog::backdrop{background:#0008}dialog label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}dialog input:not([type=checkbox]),dialog select{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}.acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
#ban{background:#e0924f33;border:1px solid var(--ac);border-radius:6px;padding:6px 10px;margin:8px 0;font-size:13px}
.ed{display:none}body.edit .ed{display:inline-block}.mu{color:var(--mu)}
</style>
</head>
<body>
<header>
  <h1>Campeões de Ethraid</h1>
  <div class="sub">Passe o mouse (ou toque) nas propriedades, origens e danos alternativos para ver o que fazem. Clique numa linha para ver a descrição.</div>
  <div id="top"></div>
  <nav id="nav"></nav>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar arma, propriedade, origem…">
    <select id="fg"></select><select id="fo"></select>
    <label style="margin-left:auto"><input type="checkbox" id="em"> ✏️ Modo edição</label>
    <span class="ed"><button id="bn" class="p">+ Novo item</button> <button id="bj">Baixar JSON</button> <button id="bs" class="p">Salvar no GitHub</button></span>
  </div>
  <div id="ban" hidden>● Você tem alterações não publicadas (rascunho salvo neste navegador). <button id="bd">Descartar rascunho</button></div>
</header>
<main id="app">Carregando…</main>
<dialog id="dlg"></dialog>
<dialog id="gh"></dialog>
<div id="tip" hidden></div>
<script>
const $=s=>document.querySelector(s),N=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cs=s=>{let o=[],d=0,c='';for(const ch of s){if(ch=='(')d++;if(ch==')')d--;if(ch==','&&!d){o.push(c.trim());c=''}else c+=ch}if(c.trim())o.push(c.trim());return o};
const GR=['Simples','Marcial','Exótica','Exótica Híbrida','Secundária','Longa','Pesada'];
const TABS={cac:'Corpo-a-corpo',dist:'Distância',fogo:'Armas de fogo',var:'Variantes',prop:'Propriedades',bloc:'Blocos culturais'};
const REDUC='Dano alternativo: o dado cai um degrau (2d8>2d6, 1d12/2d6>1d10, 1d10>1d8, 1d8/2d4>1d6, 1d6>1d4, 1d4>1). Só vale no ataque corpo-a-corpo.';
let D,tab='cac',edit=false,sk='',sd=1,SEC='armas';const DS={},FILES={armas:'data/dados.json',armaduras:'data/armaduras.json',escudos:'data/escudos.json',classes:'data/classes.json'},SECN={armas:'⚔️ Armas',armaduras:'🛡️ Armaduras',escudos:'🔰 Escudos',classes:'📜 Classes'};
const LS=()=>'ethraid_draft_'+SEC,BL=()=>DS.armas?DS.armas.blocos:[];
async function loadSec(x){if(!DS[x]){const r=await fetch(FILES[x]+'?'+Date.now());if(!r.ok)throw 0;DS[x]=await r.json()}return DS[x]}
async function go(x){SEC=x;tab=x=='armas'?'cac':x=='classes'?'0':'itens';sk='';$('#q').value='';
  try{await loadSec(x);if(x=='armaduras'||x=='escudos')await loadSec('armas')}catch(e){$('#app').innerHTML='Não foi possível carregar '+FILES[x]+'. Se abriu o arquivo direto do computador, use um servidor local (python -m http.server) ou o site publicado.';return}
  const dr=localStorage.getItem(LS());if(dr){try{DS[x]=JSON.parse(dr)}catch(e){}}
  D=DS[x];$('#ban').hidden=!dr;history.replaceState(null,'','#'+x);render()}
const init=()=>go(['armaduras','escudos','classes'].includes(location.hash.slice(1))?location.hash.slice(1):'armas');
const dirty=()=>{localStorage.setItem(LS(),JSON.stringify(D));$('#ban').hidden=false};
/* tooltips */
function prop(raw,w){const k=N(raw);let b=null,bl=0;
  const t=(nm,p)=>{const n=N(nm);if((k==n||k.startsWith(n+' ')||k.startsWith(n+'('))&&n.length>bl){b=p;bl=n.length}};
  D.propriedades.forEach(p=>t(p.nome,p));for(const a in D.aliases){const p=D.propriedades.find(x=>x.nome==D.aliases[a]);if(p)t(a,p)}
  if(k.startsWith('especial')){const e=(D.especiais||[]).find(x=>N(x.nome)==N(w.nome));return{n:'Especial',d:e?e.desc:'Efeito especial desta arma — clique na linha para ver a descrição.'}}
  return b&&b.desc?{n:b.nome,d:b.desc}:null}
const tipA=o=>o?` data-tip="${esc('<b>'+esc(o.n)+'</b>\n'+o.d)}" tabindex="0"`:'';
const chip=(raw,w)=>{const p=prop(raw,w);return`<span class="chip"${tipA(p)}>${esc(raw)}</span>`};
function orig(o){const v=/\(V\)$/.test(o),n=o.replace(/\s*\(V\)$/,''),b=BL().find(x=>N(x.nome)==N(n));
  const d=(v?'Variante estética (V): a arma tem esta aparência nessa cultura.\n\n':'')+(b?b.desc:'');
  return`<span class="chip${v?' v':''}"${d?tipA({n:n+(b?' ('+b.nivel+')':''),d}):''}>${esc(o)}</span>`}
const alt=a=>(a.alt||[]).map(x=>`<span class="chip"${tipA({n:'Dano alternativo: '+x,d:REDUC})}>${esc(x)}</span>`).join('');
const tp=$('#tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tp.hidden=true;return}
  tp.innerHTML=t.dataset.tip.replace(/\n/g,'<br>');tp.hidden=false;const r=t.getBoundingClientRect();
  tp.style.left=Math.max(8,Math.min(r.left,innerWidth-tp.offsetWidth-8))+'px';
  tp.style.top=(r.bottom+tp.offsetHeight+10>innerHeight?r.top-tp.offsetHeight-6:r.bottom+6)+'px'}
document.addEventListener('mouseover',showTip);document.addEventListener('focusin',showTip);document.addEventListener('scroll',()=>tp.hidden=true,true);
/* render */
const num=a=>{const m=(a.custo||'').match(/([\d.]+)(po|pp|pc)/);return m?parseFloat(m[1].replace(/\./g,''))*{po:1,pp:.1,pc:.01}[m[2]]:-1};
function render(){
  $('#top').innerHTML=Object.entries(SECN).map(([k,v])=>`<button data-sec="${k}" class="${k==SEC?'on':''}">${v}</button>`).join('');
  $('#q').hidden=SEC=='classes';
  if(SEC=='classes'){const cl=D.classes;if(!cl[+tab])tab='0';
    $('#nav').innerHTML=cl.map((c,i)=>`<button data-t="${i}" class="${i==tab?'on':''}">${esc(c.nome)}</button>`).join('');
    $('#fg').hidden=$('#fo').hidden=true;$('#app').innerHTML=classTab(cl[+tab],+tab);fitCT();$('#em').checked=edit;document.body.classList.toggle('edit',edit);return}
  const T=SEC=='armas'?TABS:{itens:SEC=='armaduras'?'Armaduras':'Escudos',prop:'Propriedades'};
  $('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button data-t="${k}" class="${k==tab?'on':''}">${v}</button>`).join('');
  const q=N($('#q').value),isW=SEC=='armas'&&['cac','dist','fogo'].includes(tab),isG=tab=='itens';
  $('#fg').hidden=$('#fo').hidden=!(isW||isG);
  if(isW||isG){const L=isW?D.armas.filter(a=>a.cat==tab):D.itens;fill('#fg','Todos os grupos',[...new Set(L.map(a=>a.grupo))].sort((a,b)=>isW?GR.indexOf(a)-GR.indexOf(b):0));
    fill('#fo','Todas as origens',[...new Set(L.flatMap(a=>a.origem.map(o=>o.replace(/\s*\(V\)$/,''))))].sort())}
  $('#app').innerHTML=isW?weapons(q):isG?gear(q):tab=='var'?variants(q):lists(q);
  $('#em').checked=edit;document.body.classList.toggle('edit',edit)}
function fill(id,all,vals){const s=$(id),v=s.value;s.innerHTML=`<option value="">${all}</option>`+vals.map(x=>`<option>${esc(x)}</option>`).join('');s.value=vals.includes(v)?v:''}
const hay=a=>N([a.nome,a.dano,a.custo,a.props,a.origem,a.sub,a.variantes,a.alt,a.distancia&&a.distancia.props].flat(9).join(' '));
function weapons(q){
  const g=$('#fg').value,o=$('#fo').value,cols=['Arma','Dano','Custo','Peso','Propriedades'];
  const hasO=tab!='x';let L=D.armas.map((a,i)=>({a,i})).filter(({a})=>a.cat==tab&&(!g||a.grupo==g)&&(!o||a.origem.some(x=>N(x).startsWith(N(o))))&&(!q||hay(a).includes(q)));
  const K={nome:a=>N(a.nome),custo:num,peso:a=>parseFloat((a.peso||'-1').replace(',','.'))};
  let h=`<div class="mu" style="margin:4px 0">${L.length} arma(s)</div><div class="w"><table><tr>`+
   [['Arma','nome'],['Dano'],['Custo','custo'],['Peso','peso'],['Propriedades'],['Origem'],tab=='cac'?['Dano alt.']:tab=='fogo'?['Subcategoria']:null,['']].filter(Boolean)
   .map(([t,k])=>`<th ${k?`class="s" data-s="${k}"`:''}>${t}${sk==k&&k?(sd>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
  const ncol=8;
  for(const gr of GR){let X=L.filter(({a})=>a.grupo==gr);if(!X.length)continue;
    if(sk)X.sort((x,y)=>{const u=K[sk](x.a),v=K[sk](y.a);return(u>v?1:u<v?-1:0)*sd});
    h+=`<tr class="g"><td colspan="${ncol}">${gr}</td></tr>`;
    for(const{a,i}of X){const d=a.distancia;
      h+=`<tr class="r" data-i="${i}"><td class="n">${esc(a.nome)}${a.nova?'<span class="nv">novo</span>':''}</td><td>${esc(a.dano)||'—'}</td><td>${esc(a.custo)||'—'}</td><td>${esc(a.peso)||'—'}</td>
      <td>${a.props.map(p=>chip(p,a)).join('')}${d?`<div class="hy"><b>À distância:</b> ${esc(d.dano)} · ${d.props.map(p=>chip(p,a)).join('')}</div>`:''}</td>
      <td>${a.origem.map(orig).join('')||'<span class="mu">—</span>'}</td>${tab=='cac'?`<td>${alt(a)}</td>`:tab=='fogo'?`<td>${esc(a.sub)}</td>`:''}
      <td>${edit?`<button data-e="${i}">✎</button>`:''}</td></tr>
      <tr class="d" hidden><td colspan="${ncol}">${a.desc?esc(a.desc):'<i class="mu">Sem descrição ainda.</i>'}${a.variantes.length?'\n\n<b>Variantes estéticas:</b> '+a.variantes.map(v=>vchip(v)).join(''):''}</td></tr>`}}
  return h+'</table></div>'}
function vchip(v){const m=v.match(/\(([^)]*)\)/),d=m?cs(m[1]).map(c=>{const b=D.blocos.find(x=>N(x.nome)==N(c));return b?b.nome+': '+b.desc:''}).filter(Boolean).join('\n\n'):'';
  return`<span class="chip"${d?tipA({n:v,d}):''}>${esc(v)}</span>`}
function variants(q){const L=D.armas.filter(a=>a.variantes.length&&(!q||N(a.nome+a.variantes.join(' ')).includes(q)));
  const lab={cac:'Corpo-a-corpo',dist:'Distância',fogo:'Fogo'};
  return`<div class="mu" style="margin:4px 0">Variantes estéticas — aparências alternativas para armas existentes. Passe o mouse na cultura para ver o bloco cultural. Para editar, use ✎ na arma.</div><div class="w"><table><tr><th>Arma</th><th>Tipo</th><th>Variantes</th></tr>`+
  L.map(a=>`<tr><td class="n">${esc(a.nome)}</td><td>${lab[a.cat]} · ${a.grupo}</td><td>${a.variantes.map(vchip).join('')}</td></tr>`).join('')+'</table></div>'}
function lists(q){
  const sec=(title,key,items,hint)=>{const F=items.map((x,i)=>({x,i})).filter(({x})=>!q||N(x.nome+x.desc).includes(q));
    return`<h2>${title}</h2>`+F.map(({x,i})=>edit?`<div class="card"><div class="row"><input data-l="${key}" data-i="${i}" data-f="nome" value="${esc(x.nome)}">${x.nivel!==undefined?`<input data-l="${key}" data-i="${i}" data-f="nivel" value="${esc(x.nivel)}">`:''}<button data-x="${key}:${i}">🗑</button></div><textarea rows="3" data-l="${key}" data-i="${i}" data-f="desc">${esc(x.desc)}</textarea></div>`
      :`<div class="card"><h3>${esc(x.nome)}${x.nivel?` <small class="mu">(${esc(x.nivel)})</small>`:''}</h3><p>${esc(x.desc)}</p></div>`).join('')+(edit?`<button data-a="${key}">+ Adicionar</button>`:'')};
  if(tab=='bloc')return sec('Blocos culturais','blocos',D.blocos);
  return sec('Propriedades','propriedades',D.propriedades)+(SEC!='armas'?'':sec('Propriedades especiais (campo "Especial" de cada arma — o nome é o da arma)','especiais',D.especiais||[]))}
/* eventos */
document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.sec){go(t.dataset.sec);return}
  if(t.dataset.ac!==undefined){const c=D.classes[+t.dataset.ac];c.colunas.push({g:'',t:'Nova coluna'});c.linhas.forEach(r=>r.push('—'));dirty();render();return}
  if(t.dataset.dc){const[a,b]=t.dataset.dc.split(':').map(Number),c=D.classes[a];if(confirm('Excluir a coluna "'+c.colunas[b].t+'"?')){c.colunas.splice(b,1);c.linhas.forEach(r=>r.splice(b,1));dirty();render()}return}
  if(t.dataset.dcl!==undefined){const a=+t.dataset.dcl;if(confirm('Excluir a classe '+D.classes[a].nome+'?')){D.classes.splice(a,1);tab='0';dirty();render()}return}
  if(t.dataset.t){tab=t.dataset.t;sk='';render();return}
  if(t.dataset.s){sd=sk==t.dataset.s?-sd:1;sk=t.dataset.s;render();return}
  if(t.dataset.e!==undefined){(SEC=='armas'?editW:editG)(+t.dataset.e);return}
  if(t.dataset.x){const[k,i]=t.dataset.x.split(':');if(confirm('Excluir este item?')){D[k].splice(+i,1);dirty();render()}return}
  if(t.dataset.a){D[t.dataset.a]=D[t.dataset.a]||[];D[t.dataset.a].push({nome:'Novo',desc:'',...(t.dataset.a=='blocos'?{nivel:'Secundários'}:{})});dirty();render();return}
  const r=t.closest('tr.r');if(r&&!t.closest('button')){const d=r.nextElementSibling;d.hidden=!d.hidden}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.c!==undefined){const c=D.classes[+t.dataset.c];if(t.dataset.r!==undefined)c.linhas[+t.dataset.r][+t.dataset.j]=t.value;else if(t.dataset.f)c.colunas[+t.dataset.j][t.dataset.f]=t.value;else c[t.dataset.k]=t.value;dirty();return}if(t.dataset.l){D[t.dataset.l][+t.dataset.i][t.dataset.f]=t.value;dirty()}});
['q','fg','fo'].forEach(i=>$('#'+i).addEventListener('input',render));
$('#em').onchange=e=>{edit=e.target.checked;render()};
$('#bd').onclick=()=>{if(confirm('Descartar suas alterações locais e voltar à versão publicada?')){localStorage.removeItem(LS());delete DS[SEC];go(SEC)}};
$('#bn').onclick=()=>SEC=='armas'?editW(-1):SEC=='classes'?newClass():editG(-1);
$('#bj').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download=FILES[SEC].split('/')[1];a.click()};
/* editor de arma */
function editW(i){const n=i<0,a=n?{nome:'',cat:tab=='cac'||tab=='dist'||tab=='fogo'?tab:'cac',grupo:'Simples',dano:'',custo:'',peso:'',props:[],origem:[],sub:'',nova:false,alt:[],variantes:[],desc:''}:D.armas[i],d=a.distancia||{dano:'',props:[]};
  const f=(l,id,v,ph='')=>`<label>${l}<input id="w_${id}" value="${esc(v)}" placeholder="${ph}"></label>`;
  $('#dlg').innerHTML=`<h3 style="margin:0">${n?'Nova arma':'Editar: '+esc(a.nome)}</h3>${f('Nome','nome',a.nome)}
  <div class="row"><label>Categoria<select id="w_cat">${Object.entries({cac:'Corpo-a-corpo',dist:'Distância',fogo:'Fogo'}).map(([k,v])=>`<option value="${k}" ${a.cat==k?'selected':''}>${v}</option>`)}</select></label>
  <label>Grupo<select id="w_grupo">${GR.map(g=>`<option ${a.grupo==g?'selected':''}>${g}</option>`)}</select></label></div>
  <div class="row">${f('Dano','dano',a.dano,'1d8 Cortante')}${f('Custo','custo',a.custo,'15po')}${f('Peso','peso',a.peso,'1,5kg')}</div>
  <label>Propriedades (separadas por vírgula; ex.: Versátil (1d10 Cortante), Defensiva)<textarea id="w_props" rows="2">${esc(a.props.join(', '))}</textarea></label>
  ${f('Origens (vírgula; (V) = variante estética)','origem',a.origem.join(', '))}
  <div class="row">${f('Subcategoria (fogo)','sub',a.sub)}${f('Dano alternativo (vírgula)','alt',(a.alt||[]).join(', '),'Concussão, Cortante')}</div>
  <div class="row">${f('Ataque à distância — dano (híbridas)','hd',d.dano)}<label>Ataque à distância — propriedades<input id="w_hp" value="${esc(d.props.join(', '))}"></label></div>
  <label>Variantes estéticas (uma por linha)<textarea id="w_var" rows="2">${esc(a.variantes.join('\n'))}</textarea></label>
  <label>Descrição<textarea id="w_desc" rows="4">${esc(a.desc)}</textarea></label>
  <label><input type="checkbox" id="w_nova" ${a.nova?'checked':''}> Arma nova (marcar com “novo”)</label>
  <div class="acts">${n?'':'<button id="w_del" style="margin-right:auto">🗑 Excluir</button>'}<button id="w_c">Cancelar</button><button id="w_s" class="p">Salvar</button></div>`;
  $('#dlg').showModal();const v=id=>$('#w_'+id).value.trim();
  $('#w_c').onclick=()=>$('#dlg').close();
  if(!n)$('#w_del').onclick=()=>{if(confirm('Excluir '+a.nome+'?')){D.armas.splice(i,1);dirty();$('#dlg').close();render()}};
  $('#w_s').onclick=()=>{if(!v('nome'))return alert('Informe o nome.');
    const o={nome:v('nome'),cat:v('cat'),grupo:v('grupo'),dano:v('dano'),custo:v('custo'),peso:v('peso'),props:cs(v('props')),origem:cs(v('origem')),sub:v('sub'),nova:$('#w_nova').checked,alt:cs(v('alt')),variantes:v('var')?$('#w_var').value.split('\n').map(x=>x.trim()).filter(Boolean):[],desc:$('#w_desc').value.trim()};
    if(v('hd')||v('hp'))o.distancia={dano:v('hd'),props:cs(v('hp'))};
    if(n)D.armas.push(o);else D.armas[i]=o;dirty();$('#dlg').close();render()}}
/* classes */
function classTab(c,i){const g=c.colunas,hg=g.some(x=>x.g);let h;
  if(edit){h=`<div class="row" style="margin:8px 0"><label>Nome<input class="ci" data-c="${i}" data-k="nome" value="${esc(c.nome)}"></label><label>Nome original<input class="ci" data-c="${i}" data-k="original" value="${esc(c.original)}"></label><label>Fonte<input class="ci" data-c="${i}" data-k="fonte" value="${esc(c.fonte)}"></label></div>
    <div style="margin:6px 0"><button data-ac="${i}">+ Coluna</button> <button data-dcl="${i}">🗑 Excluir classe</button> <span class="mu">Cada coluna tem “grupo” (cabeçalho que agrupa colunas vizinhas com o mesmo nome) e “título”.</span></div>
    <div class="w"><table><tr>${g.map((x,j)=>`<th><input class="ci" data-c="${i}" data-j="${j}" data-f="g" placeholder="grupo" value="${esc(x.g)}"><br><input class="ci" data-c="${i}" data-j="${j}" data-f="t" value="${esc(x.t)}"><button data-dc="${i}:${j}" title="Excluir coluna">✖</button></th>`).join('')}</tr>`+
    c.linhas.map((r,k)=>`<tr>${r.map((v,j)=>`<td><input class="ci" data-c="${i}" data-r="${k}" data-j="${j}" value="${esc(v)}"></td>`).join('')}</tr>`).join('')+'</table></div>'}
  else{let r1='',r2='';for(let j=0;j<g.length;){let k=j;while(k<g.length&&g[k].g&&g[k].g==g[j].g)k++;
      if(g[j].g){r1+=`<th colspan="${k-j}" class="gh">${esc(g[j].g)}</th>`;for(let m=j;m<k;m++)r2+=`<th>${esc(g[m].t)}</th>`;j=k}else{r1+=`<th rowspan="${hg?2:1}">${esc(g[j].t)}</th>`;j++}}
    h=`<div class="mu" style="margin:8px 0">${esc(c.original)} · ${esc(c.fonte)}</div><div class="w"><table class="ct"><tr>${r1}</tr>${hg?`<tr>${r2}</tr>`:''}`+
    c.linhas.map(r=>`<tr class="cl">${r.map((v,j)=>`<td class="${j==2?'ft':''}">${esc(v)}</td>`).join('')}</tr>`).join('')+'</table></div>'}
  return h}
function fitCT(){const t=document.querySelector('table.ct'),w=document.querySelector('.w');if(!t||!w)return;t.style.zoom=1;const a=t.scrollWidth,c=w.clientWidth;if(a>c)t.style.zoom=Math.max(.6,c/a*.99)}
addEventListener('resize',fitCT);
function newClass(){const rows=[];for(let n=1;n<=20;n++)rows.push([n+'º','+'+(2+Math.floor((n-1)/4)),'—']);
  D.classes.push({nome:'Nova classe',original:'',fonte:'',colunas:[{g:'',t:'Nível'},{g:'',t:'Bônus de Proficiência'},{g:'',t:'Características'}],linhas:rows});tab=String(D.classes.length-1);dirty();render()}
/* armaduras e escudos */
function gear(q){const g=$('#fg').value,o=$('#fo').value,ex=SEC=='armaduras',nc=ex?10:9;
  const L=D.itens.map((a,i)=>({a,i})).filter(({a})=>(!g||a.grupo==g)&&(!o||a.origem.some(x=>N(x).startsWith(N(o))))&&(!q||N([a.nome,a.ca,a.req,a.furt,a.props,a.prof,a.origem].flat(9).join(' ')).includes(q)));
  let h=`<div class="mu" style="margin:4px 0">${L.length} item(ns)</div><div class="w"><table><tr>`+['Nome','CA','Custo','Peso','Requerimento','Furtividade','Propriedades',ex?'Proficiência':null,'Origem',''].filter(x=>x!==null).map(t=>`<th>${t}</th>`).join('')+'</tr>';
  for(const gr of[...new Set(D.itens.map(a=>a.grupo))]){const X=L.filter(({a})=>a.grupo==gr);if(!X.length)continue;h+=`<tr class="g"><td colspan="${nc}">${esc(gr)}</td></tr>`;
    for(const{a,i}of X)h+=`<tr class="r"><td class="n">${esc(a.nome)}${a.nova?'<span class="nv">novo</span>':''}</td><td>${esc(a.ca)||'—'}</td><td>${esc(a.custo)||'—'}</td><td>${esc(a.peso)||'—'}</td><td>${esc(a.req)||'—'}</td><td>${esc(a.furt)||'—'}</td><td>${a.props.map(p=>chip(p,a)).join('')||'—'}</td>${ex?`<td>${esc(a.prof)||'—'}</td>`:''}<td>${a.origem.map(orig).join('')||'—'}</td><td>${edit?`<button data-e="${i}">✎</button>`:''}</td></tr><tr class="d" hidden><td colspan="${nc}">${a.desc?esc(a.desc):'<i class="mu">Sem descrição ainda.</i>'}</td></tr>`}
  return h+'</table></div>'}
function editG(i){const n=i<0,a=n?{nome:'',grupo:D.itens[0]?D.itens[0].grupo:'',ca:'',custo:'',peso:'',req:'',furt:'',props:[],prof:'',origem:[],nova:false,desc:''}:D.itens[i];
  const f=(l,id,v,ph='',x='')=>`<label>${l}<input id="i_${id}" value="${esc(v)}" placeholder="${ph}" ${x}></label>`;
  $('#dlg').innerHTML=`<h3 style="margin:0">${n?'Novo item':'Editar: '+esc(a.nome)}</h3>${f('Nome','nome',a.nome)}${f('Grupo (escolha ou digite um novo)','grupo',a.grupo,'','list="gl"')}<datalist id="gl">${[...new Set(D.itens.map(x=>x.grupo))].map(x=>`<option>${esc(x)}</option>`).join('')}</datalist>
  <div class="row">${f('Classe de Armadura','ca',a.ca,'11 + mod. de Destreza')}${f('Custo','custo',a.custo,'10po')}${f('Peso','peso',a.peso,'2,5kg')}</div>
  <div class="row">${f('Requerimento','req',a.req,'Força 13')}${f('Furtividade','furt',a.furt,'Desvantagem')}${SEC=='armaduras'?f('Proficiência','prof',a.prof,'Armadura Leve'):''}</div>
  <label>Propriedades (separadas por vírgula)<textarea id="i_props" rows="2">${esc(a.props.join(', '))}</textarea></label>${f('Origens (vírgula; (V) = variante estética)','origem',a.origem.join(', '))}
  <label>Descrição<textarea id="i_desc" rows="4">${esc(a.desc)}</textarea></label><label><input type="checkbox" id="i_nova" ${a.nova?'checked':''}> Novo (marcar com “novo”)</label>
  <div class="acts">${n?'':'<button id="i_del" style="margin-right:auto">🗑 Excluir</button>'}<button id="i_c">Cancelar</button><button id="i_s" class="p">Salvar</button></div>`;
  $('#dlg').showModal();const v=id=>$('#i_'+id).value.trim();$('#i_c').onclick=()=>$('#dlg').close();
  if(!n)$('#i_del').onclick=()=>{if(confirm('Excluir '+a.nome+'?')){D.itens.splice(i,1);dirty();$('#dlg').close();render()}};
  $('#i_s').onclick=()=>{if(!v('nome'))return alert('Informe o nome.');const o={nome:v('nome'),grupo:v('grupo'),ca:v('ca'),custo:v('custo'),peso:v('peso'),req:v('req'),furt:v('furt'),props:cs(v('props')),origem:cs(v('origem')),nova:$('#i_nova').checked,desc:$('#i_desc').value.trim()};
    if(SEC=='armaduras')o.prof=v('prof');if(n)D.itens.push(o);else D.itens[i]=o;dirty();$('#dlg').close();render()}}
/* salvar no GitHub */
$('#bs').onclick=()=>{const h=location.hostname,g=JSON.parse(localStorage.getItem('ethraid_gh')||'{}'),
  c={o:g.o||(h.endsWith('github.io')?h.split('.')[0]:''),r:g.r||location.pathname.split('/')[1]||'',b:g.b||'',p:FILES[SEC],t:g.t||''};
  const f=(l,id,v,t='text')=>`<label>${l}<input id="g_${id}" type="${t}" value="${esc(v)}"></label>`;
  $('#gh').innerHTML=`<h3 style="margin:0">Salvar no GitHub</h3><p class="mu">Grava o <code>dados.json</code> direto no repositório (um commit). O site atualiza em cerca de 1 minuto. Você precisa de um token com permissão de escrita no repositório — ele fica só neste navegador.</p>
  <div class="row">${f('Usuário/organização','o',c.o)}${f('Repositório','r',c.r)}</div><div class="row">${f('Branch (vazio = padrão)','b',c.b)}${f('Arquivo','p',c.p)}</div>
  ${f('Token do GitHub (fine-grained, Contents: Read and write)','t',c.t,'password')}${f('O que mudou? (mensagem do commit)','m','Atualiza armas pelo editor')}
  <div class="acts"><span id="g_st" class="mu" style="margin-right:auto"></span><button id="g_c">Fechar</button><button id="g_s" class="p">Publicar</button></div>`;
  $('#gh').showModal();$('#g_c').onclick=()=>$('#gh').close();
  $('#g_s').onclick=async()=>{const v=id=>$('#g_'+id).value.trim(),st=$('#g_st');
    localStorage.setItem('ethraid_gh',JSON.stringify({o:v('o'),r:v('r'),b:v('b'),p:v('p'),t:v('t')}));
    const api=`https://api.github.com/repos/${v('o')}/${v('r')}/contents/${v('p')}`,H={Authorization:'Bearer '+v('t'),Accept:'application/vnd.github+json'},br=v('b');
    try{st.textContent='Enviando…';const q=await fetch(api+(br?'?ref='+br:''),{headers:H});let sha;if(q.ok)sha=(await q.json()).sha;else if(q.status!=404)throw new Error('Leitura falhou ('+q.status+'). Confira token, usuário e repositório.');
      const body={message:v('m')||'Atualiza armas',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1)))),sha};if(br)body.branch=br;
      const p=await fetch(api,{method:'PUT',headers:H,body:JSON.stringify(body)});if(!p.ok)throw new Error('Gravação falhou ('+p.status+'): '+((await p.json()).message||''));
      localStorage.removeItem(LS());$('#ban').hidden=true;st.textContent='✔ Publicado! Atualize o site em ~1 min.'}catch(e){st.textContent='⚠ '+e.message}}};
init();
</script>
